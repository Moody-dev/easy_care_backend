services:
  - type: pserv
    name: easycare-development-mysql
    runtime: image
    image:
      url: docker.io/library/mysql:8.4
    dockerCommand: mysqld --log-bin-trust-function-creators=ON
    region: frankfurt
    plan: 1c-2g
    disk:
      name: mysql-data
      mountPath: /var/lib/mysql
      sizeGB: 5
    envVars:
      - key: MYSQL_DATABASE
        value: easycare_development
      - key: MYSQL_USER
        value: easycare_app
      - key: MYSQL_PASSWORD
        generateValue: true
      - key: MYSQL_ROOT_PASSWORD
        generateValue: true

  - type: web
    name: easycare-development-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    branch: main
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: 'off'
    healthCheckPath: /api/v1/health
    maxShutdownDelaySeconds: 90
    disk:
      name: private-files
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: APP_NAME
        value: EasyCare Development API
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: 'false'
      - key: APP_KEY
        sync: false
      - key: FRONTEND_URLS
        value: '*'
      - key: TRUSTED_PROXIES
        value: '*'
      - key: RENDER_STORAGE_ROOT
        value: /var/data
      - key: PROTECTED_FILES_ROOT
        value: /var/data/protected
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        fromService:
          name: easycare-development-mysql
          type: pserv
          property: host
      - key: DB_PORT
        value: '3306'
      - key: DB_DATABASE
        value: easycare_development
      - key: DB_USERNAME
        value: easycare_app
      - key: DB_PASSWORD
        fromService:
          name: easycare-development-mysql
          type: pserv
          envVarKey: MYSQL_PASSWORD
      - key: SESSION_DRIVER
        value: database
      - key: SESSION_SECURE_COOKIE
        value: 'true'
      - key: SESSION_HTTP_ONLY
        value: 'true'
      - key: SESSION_SAME_SITE
        value: none
      - key: SESSION_ENCRYPT
        value: 'true'
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: local
      - key: MAIL_MAILER
        value: log
      - key: LOG_CHANNEL
        value: stderr
      - key: LOG_LEVEL
        value: warning
      - key: APPOINTMENT_TIMEZONE
        value: Africa/Lagos
